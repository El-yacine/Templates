name: PocketScan Android build

on:
  push:
    paths:
      - "scanner-app/**"
      - ".github/workflows/scanner-app.yml"
  pull_request:
    paths:
      - "scanner-app/**"
      - ".github/workflows/scanner-app.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scanner-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PocketScan-debug-apk
          path: scanner-app/app/build/outputs/apk/debug/app-debug.apk
